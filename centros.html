<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Centros - ADM Analytics</title>

<style>

body{
font-family:Segoe UI,sans-serif;
background:#f4f6fa;
padding:30px;
margin:0;
}

h1{
color:#0f172a;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
margin-top:0;
color:#0b5ed7;
}

.kpi{
display:flex;
justify-content:space-between;
margin:10px 0;
padding:8px 0;
border-bottom:1px solid #eee;
}

.link{
display:inline-block;
margin-top:30px;
text-decoration:none;
color:#0b5ed7;
font-weight:bold;
}

</style>

</head>

<body>
