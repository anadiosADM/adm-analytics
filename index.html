<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ADM Analytics</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6fa;
}

.app{
display:flex;
min-height:100vh;
}

.sidebar{
width:240px;
background:#0f172a;
color:white;
padding:30px 20px;
}

.logo{
font-size:30px;
font-weight:bold;
margin-bottom:40px;
}

.menu{
list-style:none;
}

.menu li{
padding:15px;
margin-bottom:10px;
border-radius:10px;
background:#1e293b;
}

.main{
flex:1;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h1{
color:#0f172a;
}

.kpis{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
text-align:center;
}

.card h2{
font-size:42px;
color:#0b5ed7;
}

.card p{
margin-top:10px;
font-weight:bold;
}

.objetivo{
margin-top:10px;
color:#666;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:25px;
}

.panel{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.panel h3{
margin-bottom:20px;
}

.coordinadora{
padding:15px;
background:#f8fafc;
border-radius:10px;
margin-bottom:10px;
}

.ok{
color:green;
font-weight:bold;
}

.warning{
color:#d97706;
font-weight:bold;
}

.danger{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<div class="app">

<div class="sidebar">

<div class="logo">
ADM
</div>

<ul class="menu">
<li>🏠 Dashboard</li>
<li>🏪 Centros</li>
<li>👥 Comerciales</li>
</ul>

</div>
